conky.config = {
	-- Various settings
	background         = false,     -- forked to background
	cpu_avg_samples    = 2,         -- The number of samples to average for CPU monitoring.
	diskio_avg_samples = 10,        -- The number of samples to average for disk I/O monitoring.
	double_buffer      = true,      -- Use the Xdbe extension? (eliminates flicker)
	if_up_strictness   = 'address', -- how strict if testing interface is up - up, link or address
	net_avg_samples    = 2,         -- The number of samples to average for net data
	no_buffers         = true,      -- Subtract (file system) buffers from used memory?
	temperature_unit   = 'celsius', -- fahrenheit or celsius
	text_buffer_size   = 2048,      -- size of buffer for display of content of large variables - default 256
	update_interval    = 5,         -- update interval
	imlib_cache_size   = 0,         -- disable image cache to get a new spotify cover per song
	out_to_x           = false,     -- Do not attempt to use X.
	out_to_wayland     = true,      -- Only use Wayland.

	-- Placement
	alignment = 'top_left',

	-- Size and margin
	gap_x         = 0,   -- pixels between right or left border
	gap_y         = -10, -- pixels between bottom or left border
	maximum_width = 500, -- maximum width of window

	-- Graphical
	border_inner_margin   = 10,        -- margin between border and text
	border_outer_margin   = 10,        -- margin between border and edge of window
	border_width          = 0,         -- border width in pixels
	default_bar_width     = 0,         -- default is 0 - full width
	default_bar_height    = 10,        -- default is 6
	default_gauge_height  = 10,        -- default is 25
	default_gauge_width   = 0,         -- default is 40
	default_graph_height  = 15,        -- default is 25
	default_graph_width   = 0,         -- default is 0 - full width
	default_shade_color   = '#000000', -- default shading colour
	default_outline_color = '#000000', -- default outline colour
	draw_borders          = false,     -- draw borders around text
	draw_graph_borders    = false,     -- draw borders around graphs
	draw_shades           = false,     -- draw shades
	draw_outline          = false,     -- draw outline
	stippled_borders      = 0,         -- dashing the border
	show_graph_range      = false,     -- Shows the time range covered by a graph
	show_graph_scale      = false,     -- Shows the maximum value in scaled graphs

	-- Textual
	extra_newline         = false,              -- extra newline at the end
	format_human_readable = true,               -- KiB, MiB rather then number of bytes
	font                  = 'Iosevka:size=10', -- font for complete conky unless in code defined
	max_text_width        = 0,                  -- 0 will make sure line does not get broken if width too small
	max_user_text         = 16384,              -- max text in conky default 16384
	override_utf8_locale  = true,               -- force UTF8 requires xft
	short_units           = true,               -- shorten units from KiB to k
	top_name_width        = 20,                 -- width for $top name value default 15
	top_name_verbose      = false,              -- If true, top name shows the full command line of each  process - Default value is false.
	uppercase             = false,              -- uppercase or not
	use_spacer            = 'none',             -- adds spaces around certain objects to align - default none
	use_xft               = true,               -- XFT font - anti-aliased font
	xftalpha              = 1,                  -- alpha of the XFT font - between 0-1

	-- Windows
	own_window             = true,           -- create your own window to draw
	own_window_colour      = '#00000000',    -- set ARGB colour for window
	own_window_title       = 'system_conky', -- set the name manually - default conky "hostname"
	own_window_type        = 'desktop',      -- if own_window true options are: normal/override/dock/desktop/panel
	own_window_hints       = 'undecorated,below,sticky,skip_taskbar,skip_pager', -- if own_window true - just hints - own_window_type sets it

	-- Themes
	-- Grayscale colors and font
	default_color = '#f7f3ef',                      -- Foreground
	color1        = '#a9a5a0',                      -- Background
	color2        = '#c4c0bb',                      -- Comments
	color3        = '#f7f3ef',                      -- Sections
	color4        = '#f7f3ef',                      -- Fields
	color5        = '#f7f3ef',                      -- Strings
	color6        = '#f7f3ef',                      -- Integers
	font1         = 'Iosevka:size=10:weight=bold', -- Sections
	font2         = 'Iosevka:size=10:italic',      -- Fields
	font3         = 'Iosevka:size=10',             -- Values
};

conky.text = [[
${color2}\# System-wide information.${color}
${color3}${font1}[system]${font}${color}
${color4}${font2}hostname${font}${color}     = ${color5}${font3}"${nodename}"${font}${color}
${color4}${font2}kernel${font}${color}       = ${color5}${font3}"${kernel}"${font}${color}
${color4}${font2}uptime${font}${color}       = ${color5}${font3}"${uptime_short}"${font}${color}
${color4}${font2}processes${font}${color}    = ${color6}${font3}${processes}${font}${color}
${color4}${font2}units-failed${font}${color} = ${color6}${font3}${texeci 60 echo -n $(($(systemctl --failed --no-legend | wc -l) + $(systemctl --user --failed --no-legend | wc -l)))}${font}${color}

${color2}\# Processor statistics.${color}
${color3}${font1}[cpu]${font}${color}
${color4}${font2}usage-percent${font}${color} = ${color6}${font3}${cpu cpu0}${font}${color}
${color4}${font2}temp-celcius${font}${color}  = ${color6}${font3}${texeci 30 awk '{print $0 / 1000}' $(dirname $(grep -l x86_pkg_temp /sys/class/thermal/thermal_zone*/type))/temp}${font}${color}
${color4}${font2}frequency-mhz${font}${color} = ${color6}${font3}${freq}${font}${color}

${color2}\# Memory statistics.${color}
${color3}${font1}[memory]${font}${color}
${color4}${font2}usage-percent${font}${color}      = ${color6}${font3}${memperc}${font}${color}
${color4}${font2}swap-usage-percent${font}${color} = ${color6}${font3}${swapperc}${font}${color}

${color2}\# Network statistics.${color}
${color3}${font1}[network.down]${font}${color}
${color4}${font2}speed-bytes${font}${color} = ${color5}${font3}"${downspeed ${gw_iface}}"${font}${color}
${color4}${font2}total-bytes${font}${color} = ${color5}${font3}"${totaldown ${gw_iface}}"${font}${color}

${color3}${font1}[network.up]${font}${color}
${color4}${font2}speed-bytes${font}${color} = ${color5}${font3}"${upspeed ${gw_iface}}"${font}${color}
${color4}${font2}total-bytes${font}${color} = ${color5}${font3}"${totalup ${gw_iface}}"${font}${color}

${color2}\# Miscellaneous information.${color}
${color3}${font1}[misc]${font}${color}
${color4}${font2}events${font}${color} = [${color5}${font3}${texeci 1800 khal --no-color list --once --notstarted --day-format '' --format '{nl}  "{start-time}–{end-time}: {title}",{nl}' now 24h | tr -s '\n'}${font}${color}
]

${color4}${font2}fortune${font}${color} = ${color5}${font3}"""
${texeci 60 fortune -s | fmt --width 40}
"""${font}${color}
]];

