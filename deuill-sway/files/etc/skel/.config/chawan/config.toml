[start]
# Default home view.
visual-home = "cgi-bin:chabookmark?action=view"

[buffer]
# Enable image display by default.
images = true
# Enable cookie storage for all sites.
cookie = true

[external]
# Default path for downloads.
download-dir = "~/Downloads"
# Copy-paste for Wayland.
copy-cmd  = "wl-copy"
paste-cmd = "wl-paste"

# Keybindings.
[page]
"o" = "loadCursor"
"O" = "load"
"J" = "prevBuffer"
"K" = "nextBuffer"

[line]
"C-j" = "line.prevHist"
"C-k" = "line.nextHist"
"C-g" = "line.cancel"
