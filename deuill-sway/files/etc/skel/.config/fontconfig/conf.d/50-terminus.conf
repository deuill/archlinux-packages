<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>Terminus</family>
    <prefer>
      <family>Terminess Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>Terminus Propo</family>
