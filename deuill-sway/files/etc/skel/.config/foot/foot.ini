# Generic configuration.
shell       = /usr/bin/fish --login
term        = foot-direct
login-shell = yes

# Appearance.
font                = Terminus:size=10
pad                 = 10x10
initial-color-theme = light

[bell]
urgent = yes

[scrollback]
lines = 10000

[cursor]
style = block

[colors-light]
background = e0dcd7
foreground = 1d1b19

cursor      = e0dcd7 ab4649
jump-labels = f7f3ef ab4649

## Normal/regular colors (color palette 0-7).
regular0 = 0a0b08 # black
regular1 = ab4649 # red
regular2 = 2c2b23 # green
regular3 = 4e4b47 # yellow
regular4 = 2c2b23 # blue
regular5 = 2c2b23 # magenta
regular6 = 4e4b47 # cyan
regular7 = e0dcd7 # white

## Bright colors (color palette 8-15).
bright0 = 2c2b23 # bright black
bright1 = ab4649 # bright red
bright2 = 706c68 # bright green
bright3 = a9a5a0 # bright yellow
bright4 = 706c68 # bright blue
bright5 = 706c68 # bright magenta
bright6 = a9a5a0 # bright cyan
bright7 = f7f3ef # bright white

[colors-dark]
background = 1d1b19
foreground = e0dcd7

cursor      = e0dcd7 ab4649
jump-labels = f7f3ef ab4649

## Normal/regular colors (color palette 0-7).
regular0 = 0a0b08 # black
regular1 = ab4649 # red
regular2 = a9a5a0 # green
regular3 = c4c0bb # yellow
regular4 = a9a5a0 # blue
regular5 = c4c0bb # magenta
regular6 = c4c0bb # cyan
regular7 = e0dcd7 # white

## Bright colors (color palette 8-15).
bright0 = 2c2b23 # bright black
bright1 = ab4649 # bright red
bright2 = c4c0bb # bright green
bright3 = e0dcd7 # bright yellow
bright4 = c4c0bb # bright blue
bright5 = e0dcd7 # bright magenta
bright6 = e0dcd7 # bright cyan
bright7 = f7f3ef # bright white

[key-bindings]
pipe-scrollback = [sh -c "f=$(mktemp) && cat - > $f && emacs $f; rm --force $f"] Control+Shift+space
